<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSINT Graph — Каталог инструментов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --muted: #737373;
      --accent: #00d4aa;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --primary: #00d4aa;
      --secondary: #ff6b6b;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
    }
    
    .dark {
      background: var(--bg);
      color: var(--fg);
    }
    
    /* Graph canvas area */
    #graph-container {
      position: relative;
      width: 100%;
      height: 700px;
      min-height: 400px;
    }
    
    .node {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
      border: 2px solid var(--border);
    }
    
    .node:hover {
      transform: scale(1.3);
      z-index: 100;
    }
    
    .node.active {
      box-shadow: 0 0 25px var(--accent);
      border-color: var(--accent);
    }
    
    .node-label {
      position: absolute;
      bottom: -24px;
      font-size: 10px;
      text-align: center;
      width: 48px;
      color: var(--muted);
      font-weight: 500;
    }
    
    .edge {
      position: absolute;
      background: var(--border);
      pointer-events: none;
      z-index: 1;
    }
    
    /* Controls */
    .control-panel {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.25rem;
    }
    
    .category-btn {
      padding: 0.6rem 1.2rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    .category-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .category-btn.active {
      background: var(--accent);
      color: var(--bg);
    }
    
    .category-btn.secondary:hover {
      border-color: var(--secondary);
      color: var(--secondary);
    }
    
    .category-btn.secondary.active {
      background: var(--secondary);
      color: var(--bg);
    }
    
    /* Search */
    .search-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.6rem 1rem;
      width: 220px;
      font-size: 0.875rem;
    }
    
    .search-input::placeholder {
      color: var(--muted);
    }
    
    /* Stats */
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      border-radius: 6px;
      transition: transform 0.2s ease;
    }
    
    .stat-card:hover {
      transform: translateY(-2px);
    }
    
    .stat-number {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: var(--card);
      padding: 2rem;
      width: 92%;
      max-width: 560px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    
    .modal-close:hover {
      background: var(--border);
      color: var(--fg);
    }
    
    /* Legend */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
    
    /* Focus states */
    .category-btn:focus-visible,
    .search-input:focus-visible,
    .modal-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>
<body class="dark">

  <!-- Navigation -->
  <nav class="border-b border-[var(--border)] bg-[var(--card)]/80 backdrop-blur-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="#" class="text-xl font-bold tracking-tighter" style="color: var(--accent);">OSINT Graph</a>
      
      <div class="flex items-center gap-4">
        <!-- Language switch -->
        <div class="locale-switch relative" role="group" aria-label="Language">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="lucide lang-icon h-4 w-4 text-muted-foreground" aria-hidden="true">
            <path d="m5 8 6 6"/>
            <path d="m4 14 6-6"/>
            <path d="M2 5h12"/>
            <path d="M7 2h1"/>
            <path d="m22 22-5-10-5 10"/>
            <path d="M14 18h6"/>
          </svg>
          <button type="button" aria-pressed="true" class="locale-switch-option locale-switch-option-active ru-btn">RU</button>
          <button type="button" aria-pressed="false" class="locale-switch-option en-btn">EN</button>
        </div>
        
        <button class="btn-icon hidden md:inline-flex items-center gap-2 px-3 py-1 rounded hover:bg-[var(--border)] transition-colors" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="text-xs hidden md-block">Поиск</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-6 md:p-8">
    
    <!-- Stats Summary -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="stat-card rounded-lg">
        <div class="stat-number" id="total-tools">0</div>
        <div class="stat-label">Инструментов</div>
      </div>
      <div class="stat-card rounded-lg">
        <div class="stat-number" id="total-categories">0</div>
        <div class="stat-label">Категорий</div>
      </div>
      <div class="stat-card rounded-lg">
        <div class="stat-number" id="active-tools">0</div>
        <div class="stat-label">Активных</div>
      </div>
    </div>
    
    <!-- Controls -->
    <div class="control-panel rounded-lg mb-6 flex flex-col md:flex-row gap-4 items-start md:items-center">
      <div class="flex-1">
        <input type="text" id="search-input" class="search-input w-full rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]" placeholder="Поиск инструментов...">
      </div>
      <div class="flex gap-2">
        <button id="reset-btn" class="category-btn active" data-filter="all">Все</button>
        <button id="cat-intelligence" class="category-btn" data-filter="intelligence">Интеллект</button>
        <button id="cat-network" class="category-btn secondary" data-filter="network">Сеть</button>
        <button id="cat-web" class="category-btn secondary" data-filter="web">Web</button>
        <button id="cat-malware" class="category-btn secondary" data-filter="malware">Мальвар</button>
      </div>
    </div>
    
    <!-- Graph Area -->
    <div id="graph-container"></div>
    
    <!-- Legend -->
    <div class="mt-8 pt-8 border-t border-[var(--border)] flex flex-wrap gap-4 text-sm text-muted-foreground">
      <div class="legend-item">
        <span class="legend-dot" style="background: #5a5a5a;"></span>
        <span>Узлы (инструменты)</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: #3a3a3a;"></span>
        <span>Связи между инструментами</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--accent);"></span>
        <span>Активные инструменты</span>
      </div>
    </div>
    
  </main>

  <!-- Tool Details Modal -->
  <div id="tool-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" aria-label="Закрыть" onclick="closeModal()">&times;</button>
      <div id="modal-content-area">
        <!-- Content loaded dynamically -->
      </div>
    </div>
  </div>

  <script>
    // Data - OSINT tools with categories (expanded dataset)
    const toolsData = [
      { id: 1, name: 'Shodan', category: 'network', description: 'Поисковик для интернета вещей', active: true },
      { id: 2, name: 'Censys', category: 'network', description: 'Атаку поверхности интернета', active: true },
      { id: 3, name: 'Fofa', category: 'network', description: 'Китайский поисковик активов', active: true },
      { id: 4, name: 'PassiveTotal', category: 'intelligence', description: 'Корреляция данных из пассивных DNS', active: true },
      { id: 5, name: 'VirusTotal', category: 'malware', description: 'Анализ файлов и URL', active: true },
      { id: 6, name: 'Any.Run', category: 'malware', description: 'Взаимодействие с муляркой в браузере', active: true },
      { id: 7, name: 'Hybrid Analysis', category: 'malware', description: 'Анализ подозрительных файлов', active: true },
      { id: 8, name: 'AbuseIPDB', category: 'intelligence', description: 'База данных злоупотребляющих IP', active: true },
      { id: 9, name: 'OTX Alienvault', category: 'intelligence', description: 'Open Threat Exchange', active: true },
      { id: 10, name: 'Greynoise', category: 'intelligence', description: 'Анализ сканирования интернета', active: true },
      { id: 11, name: 'URLScan.io', category: 'web', description: 'Просмотр скриншотов страниц', active: true },
      { id: 12, name: 'BuiltWith', category: 'web', description: 'Технологии сайтов', active: true },
      { id: 13, name: 'Wappalyzer', category: 'web', description: 'Идентификация технологий', active: true },
      { id: 14, name: 'Fiddler', category: 'web', description: 'Отладка HTTP/HTTPS', active: true },
      { id: 15, name: 'Burp Suite', category: 'web', description: 'Тестирование безопасности веб', active: true },
      { id: 16, name: 'Nikto', category: 'web', description: 'Сканер веб-серверов', active: true },
      { id: 17, name: 'Nmap', category: 'network', description: 'Сканер портов сети', active: true },
      { id: 18, name: 'Masscan', category: 'network', description: 'Быстрый сканер портов', active: true },
      { id: 19, name: 'ZMap', category: 'network', description: 'Сканер全量 интернета', active: true },
      { id: 20, name: 'Recon-ng', category: 'intelligence', description: 'Фреймворк разведки', active: true },
      { id: 21, name: 'Maltego', category: 'intelligence', description: 'Графовый анализ данных', active: true },
      { id: 22, name: 'SpiderFoot', category: 'intelligence', description: 'Автоматизированная разведка', active: true },
      { id: 23, name: 'theHarvester', category: 'intelligence', description: 'Сбор информации о доменах', active: true },
      { id: 24, name: 'Photon', category: 'web', description: 'Поисковик для OSINT', active: true },
      { id: 25, name: 'GoBuster', category: 'web', description: 'Brute forcing директорий и DNS', active: true },
    ];
    
    // Layout calculations
    const container = document.getElementById('graph-container');
    const svg = document.createElementNS ? document.createElementNS('http://www.w3.org/2000/svg', 'svg') : document.createElement('svg');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '700');
    svg.style.width = '100%';
    svg.style.height = '700px';
    svg.style.background = 'var(--bg)';
    container.appendChild(svg);
    
    const width = container.clientWidth || 900;
    const height = 700;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    
    // Calculate positions using circle layout by category
    const categories = ['network', 'intelligence', 'malware', 'web'];
    const categoryAngle = (Math.PI * 2) / categories.length;
    const baseRadius = 180;
    
    const nodes = [];
    const edges = [];
    
    toolsData.forEach((tool, index) => {
      const catIndex = categories.indexOf(tool.category);
      const angle = catIndex * categoryAngle + (Math.random() - 0.5) * 0.3;
      const radius = baseRadius + Math.random() * 40;
      
      const x = width / 2 + radius * Math.cos(angle);
      const y = height / 2 + radius * Math.sin(angle);
      
      nodes.push({
        id: tool.id,
        x: x,
        y: y,
        radius: 24,
        title: tool.name,
        category: tool.category,
        active: tool.active,
        description: tool.description
      });
    });
    
    // Create edges between tools in same category
    toolsData.forEach((tool, i) => {
      toolsData.slice(i + 1).forEach((other, j) => {
        if (tool.category === other.category) {
          edges.push({
            source: tool.id,
            target: other.id
          });
        }
      });
    });
    
    // Draw edges
    const edgeGroup = document.createElementNS ? document.createElementNS('http://www.w3.org/2000/svg', 'g') : document.createElement('g');
    edges.forEach(edge => {
      const source = nodes.find(n => n.id === edge.source);
      const target = nodes.find(n => n.id === edge.target);
      if (source && target) {
        const line = document.createElementNS ? document.createElementNS('http://www.w3.org/2000/svg', 'line') : document.createElement('line');
        line.setAttribute('x1', source.x);
        line.setAttribute('y1', source.y);
        line.setAttribute('x2', target.x);
        line.setAttribute('y2', target.y);
        line.setAttribute('stroke', '#3a3a3a');
        line.setAttribute('stroke-width', '1');
        line.setAttribute('opacity', '0.2');
        edgeGroup.appendChild(line);
      }
    });
    svg.appendChild(edgeGroup);
    
    // Draw nodes
    const nodeGroup = document.createElementNS ? document.createElementNS('http://www.w3.org/2000/svg', 'g') : document.createElement('g');
    const activeNodes = new Set();
    
    nodes.forEach(node => {
      // Node circle
      const circle = document.createElementNS ? document.createElementNS('http://www.w3.org/2000/svg', 'circle') : document.createElement('circle');
      circle.setAttribute('cx', node.x);
      circle.setAttribute('cy', node.y);
      circle.setAttribute('r', node.radius);
      circle.setAttribute('fill', node.active ? '#00d4aa' : '#2a2a2a');
      circle.setAttribute('stroke', node.active ? '#00d4aa' : '#2a2a2a');
      circle.setAttribute('stroke-width', '2');
      circle.setAttribute('data-id', node.id);
      circle.setAttribute('class', 'node');
      
      circle.addEventListener('click', () => showToolDetails(node));
      
      if (node.active) {
        activeNodes.add(node.id);
        circle.classList.add('active');
      }
      
      // Add category-specific color tint
      const catColor = getCategoryColor(node.category);
      circle.style.filter = `hue-rotate(${catColor}deg)`;
      
      nodeGroup.appendChild(circle);
      
      // Label
      const label = document.createElement('div');
      label.className = 'node-label';
      label.textContent = node.title;
      label.style.left = node.x - 24 + 'px';
      label.style.top = (node.y + 32) + 'px';
      label.style.position = 'absolute';
      label.style.pointerEvents = 'none';
      label.style.fontSize = '11px';
      label.style.color = 'var(--muted)';
      label.style.whiteSpace = 'nowrap';
      document.body.appendChild(label);
    });
    
    svg.appendChild(nodeGroup);
    
    // Category filters
    const categoryBtns = document.querySelectorAll('.category-btn');
    const searchInput = document.getElementById('search-input');
    
    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active', 'secondary'));
        btn.classList.add('active');
        filterNodes(btn.dataset.filter);
      });
    });
    
    function filterNodes(filter) {
      nodes.forEach(node => {
        const show = filter === 'all' || node.category === filter;
        const circle = svg.querySelector(`[data-id="${node.id}"]`);
        if (circle) {
          circle.style.opacity = show ? '1' : '0.3';
        }
        const label = document.querySelector(`.node-label[data-id="${node.id}"]`);
        if (label) {
          label.style.opacity = show ? '1' : '0.3';
        }
      });
      
      document.querySelectorAll('.node-label').forEach(label => {
        const id = parseInt(label.getAttribute('data-id') || '0');
        const node = nodes.find(n => n.id === id);
        if (node) {
          label.style.display = (filter === 'all' || node.category === filter) ? 'block' : 'none';
        }
      });
    }
    
    function getCategoryColor(category) {
      const colors = {
        'network': 0,
        'intelligence': 120,
        'malware': 20,
        'web': 240
      };
      return (colors[category] || 0) * 10;
    }
    
    // Search functionality
    let currentFilter = 'all';
    
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      nodes.forEach(node => {
        const matches = node.title.toLowerCase().includes(term) || 
                       node.description.toLowerCase().includes(term);
        const circle = svg.querySelector(`[data-id="${node.id}"]`);
        if (circle) {
          circle.style.opacity = matches ? '1' : '0.3';
        }
      });
    });
    
    // Reset button
    document.getElementById('reset-btn').click();
    
    // Modal functionality
    function showToolDetails(node) {
      const modal = document.getElementById('tool-modal');
      const contentArea = document.getElementById('modal-content-area');
      
      contentArea.innerHTML = `
        <h3 class="text-2xl font-semibold mb-3">${node.title}</h3>
        <p class="text-muted-foreground text-sm mb-4">${node.description}</p>
        <p class="text-sm text-muted-foreground">Категория: ${capitalize(node.category)}</p>
      `;
      
      modal.classList.remove('hidden');
      modal.style.display = 'flex';
    }
    
    function closeModal() {
      const modal = document.getElementById('tool-modal');
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }
    
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
    
    // Language switch
    const ruBtn = document.querySelector('.ru-btn');
    const enBtn = document.querySelector('.en-btn');
    
    ruBtn.addEventListener('click', () => {
      ruBtn.classList.add('locale-switch-option-active');
      enBtn.classList.remove('locale-switch-option-active');
    });
    
    enBtn.addEventListener('click', () => {
      enBtn.classList.add('locale-switch-option-active');
      ruBtn.classList.remove('locale-switch-option-active');
    });
    
    // Handle resize
    window.addEventListener('resize', () => {
      const newWidth = container.clientWidth || 900;
      svg.setAttribute('width', newWidth);
    });
    
    // Reduced motion check
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      nodes.forEach(node => {
        const circle = svg.querySelector(`[data-id="${node.id}"]`);
        if (circle) {
          circle.style.opacity = '1';
        }
      });
    }
  </script>
</body>
</html>
