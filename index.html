<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OSINT Framework — Каталог инструментов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --muted: #737373;
      --accent: #00d4aa;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --sidebar: #121212;
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
    }
    
    .dark {
      background: var(--bg);
      color: var(--fg);
    }
    
    /* Sidebar */
    .sidebar {
      background: var(--sidebar);
      min-height: 100vh;
      border-right: 1px solid var(--border);
    }
    
    .sidebar-link {
      display: flex;
      align-items: center;
      padding: 0.875rem 1rem;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
    }
    
    .sidebar-link:hover {
      color: var(--fg);
      background: var(--card);
      border-left: 3px solid var(--accent);
    }
    
    .sidebar-link.active {
      color: var(--accent);
      background: var(--card);
      border-left: 3px solid var(--accent);
    }
    
    .sidebar-link svg {
      width: 18px;
      height: 18px;
      margin-right: 0.75rem;
      flex-shrink: 0;
    }
    
    /* Main content */
    .main-content {
      padding: 2rem;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    
    /* Tools grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    
    /* Tool card */
    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .tool-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 212, 170, 0.15);
    }
    
    .tool-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 212, 170, 0.4);
    }
    
    .tool-card.category-network { border-left: 4px solid #00d4aa; }
    .tool-card.category-intelligence { border-left: 4px solid #ff6b6b; }
    .tool-card.category-malware { border-left: 4px solid #ffa502; }
    .tool-card.category-web { border-left: 4px solid #4ecdc4; }
    
    .tool-card .tool-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }
    
    .tool-card .tool-desc {
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .tool-card .tool-category {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-top: 0.5rem;
    }
    
    /* Search */
    .search-wrapper {
      position: relative;
    }
    
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--fg);
      border-radius: 6px;
      font-size: 0.875rem;
      transition: border-color 0.2s ease;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .search-input::placeholder {
      color: var(--muted);
    }
    
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    
    /* Filters */
    .filter-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 0.875rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    .filter-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .filter-chip.active {
      background: var(--accent);
      color: var(--bg);
    }
    
    .filter-chip.secondary {
      background: var(--card);
    }
    
    .filter-chip.secondary:hover {
      border-color: var(--secondary);
      color: var(--secondary);
    }
    
    .filter-chip.secondary.active {
      background: var(--secondary);
      color: var(--bg);
    }
    
    /* Stats */
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    
    .modal-close:hover {
      background: var(--border);
      color: var(--fg);
    }
    
    .modal-close svg {
      width: 18px;
      height: 18px;
    }
    
    .modal-tool-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .modal-tool-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 1rem;
      display: inline-block;
    }
    
    .modal-tool-desc {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    
    /* Category badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.5rem;
      background: var(--border);
      border-radius: 4px;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-right: 0.25rem;
    }
    
    .badge.network { background: rgba(0, 212, 170, 0.2); color: var(--accent); }
    .badge.intelligence { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
    .badge.malware { background: rgba(255, 165, 2, 0.2); color: #ffa502; }
    .badge.web { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; }
    
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
    
    /* Focus states */
    .search-input:focus-visible,
    .filter-chip:focus-visible,
    .modal-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>
<body class="dark">

  <!-- Sidebar -->
  <div class="sidebar w-64 flex-shrink-0">
    <div class="p-6 border-b border-[var(--border)]">
      <h1 class="text-xl font-bold tracking-tighter" style="color: var(--accent);">OSINT Framework</h1>
      <p class="text-sm text-muted-foreground mt-1">Каталог инструментов Open Source Intelligence</p>
    </div>
    
    <nav class="p-6 space-y-1">
      <!-- Category buttons -->
      <button class="filter-chip active w-full" data-category="all">Все категории</button>
      <button class="filter-chip w-full" data-category="network">Сеть</button>
      <button class="filter-chip w-full secondary" data-category="intelligence">Интеллект</button>
      <button class="filter-chip w-full secondary" data-category="malware">Мальвар</button>
      <button class="filter-chip w-full secondary" data-category="web">Web</button>
    </nav>
    
    <div class="p-6 border-t border-[var(--border)]">
      <p class="text-xs text-muted-foreground">Всего инструментов: <span id="total-tools">25</span></p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header mb-6">
      <h1 class="page-title">OSINT Graph — Tools Framework</h1>
    </header>
    
    <!-- Search -->
    <div class="search-wrapper mb-6">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" class="search-input" placeholder="Поиск инструментов OSINT...">
    </div>
    
    <!-- Tools Grid -->
    <div id="tools-grid" class="tools-grid">
      <!-- Cards loaded by JavaScript -->
    </div>
    
    <!-- No results -->
    <div id="no-results" class="hidden items-center py-12 text-center text-muted-foreground">
      <svg class="w-12 h-12 mx-auto mb-3 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=""><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Инструменты не найдены</span>
    </div>
  </main>

  <!-- Tool Details Modal -->
  <div id="tool-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" aria-label="Закрыть" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=""><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="modal-content-area">
        <!-- Content loaded dynamically -->
      </div>
    </div>
  </div>

  <script>
    // Data - OSINT tools with categories
    const toolsData = [
      { id: 1, name: 'Shodan', category: 'network', description: 'Поисковик для интернета вещей', active: true },
      { id: 2, name: 'Censys', category: 'network', description: 'Атаку поверхности интернета', active: true },
      { id: 3, name: 'Fofa', category: 'network', description: 'Китайский поисковик активов', active: true },
      { id: 4, name: 'PassiveTotal', category: 'intelligence', description: 'Корреляция данных из пассивных DNS', active: true },
      { id: 5, name: 'VirusTotal', category: 'malware', description: 'Анализ файлов и URL', active: true },
      { id: 6, name: 'Any.Run', category: 'malware', description: 'Взаимодействие с муляркой в браузере', active: true },
      { id: 7, name: 'Hybrid Analysis', category: 'malware', description: 'Анализ подозрительных файлов', active: true },
      { id: 8, name: 'AbuseIPDB', category: 'intelligence', description: 'База данных злоупотребляющих IP', active: true },
      { id: 9, name: 'OTX Alienvault', category: 'intelligence', description: 'Open Threat Exchange', active: true },
      { id: 10, name: 'Greynoise', category: 'intelligence', description: 'Анализ сканирования интернета', active: true },
      { id: 11, name: 'URLScan.io', category: 'web', description: 'Просмотр скриншотов страниц', active: true },
      { id: 12, name: 'BuiltWith', category: 'web', description: 'Технологии сайтов', active: true },
      { id: 13, name: 'Wappalyzer', category: 'web', description: 'Идентификация технологий', active: true },
      { id: 14, name: 'Fiddler', category: 'web', description: 'Отладка HTTP/HTTPS', active: true },
      { id: 15, name: 'Burp Suite', category: 'web', description: 'Тестирование безопасности веб', active: true },
      { id: 16, name: 'Nikto', category: 'web', description: 'Сканер веб-серверов', active: true },
      { id: 17, name: 'Nmap', category: 'network', description: 'Сканер портов сети', active: true },
      { id: 18, name: 'Masscan', category: 'network', description: 'Быстрый сканер портов', active: true },
      { id: 19, name: 'ZMap', category: 'network', description: 'Сканер全量 интернета', active: true },
      { id: 20, name: 'Recon-ng', category: 'intelligence', description: 'Фреймворк разведки', active: true },
      { id: 21, name: 'Maltego', category: 'intelligence', description: 'Графовый анализ данных', active: true },
      { id: 22, name: 'SpiderFoot', category: 'intelligence', description: 'Автоматизированная разведка', active: true },
      { id: 23, name: 'theHarvester', category: 'intelligence', description: 'Сбор информации о доменах', active: true },
      { id: 24, name: 'Photon', category: 'web', description: 'Поисковик для OSINT', active: true },
      { id: 25, name: 'GoBuster', category: 'web', description: 'Brute forcing директорий и DNS', active: true },
    ];
    
    // Category colors
    const categoryColors = {
      'network': { color: '#00d4aa', text: '#00d4aa' },
      'intelligence': { color: '#ff6b6b', text: '#ff6b6b' },
      'malware': { color: '#ffa502', text: '#ffa502' },
      'web': { color: '#4ecdc4', text: '#4ecdc4' }
    };
    
    // DOM Elements
    const toolsGrid = document.getElementById('tools-grid');
    const searchInput = document.getElementById('search-input');
    const filterChips = document.querySelectorAll('.filter-chip');
    const modal = document.getElementById('tool-modal');
    const modalContent = document.getElementById('modal-content-area');
    
    // Render tools grid
    function renderTools(filteredTools) {
      if (filteredTools.length === 0) {
        toolsGrid.innerHTML = '';
        document.getElementById('no-results').classList.remove('hidden');
        return;
      }
      
      document.getElementById('no-results').classList.add('hidden');
      
      toolsGrid.innerHTML = filteredTools.map((tool, index) => `
        <article class="tool-card category-${tool.category}" 
                 data-id="${tool.id}" 
                 data-category="${tool.category}"
                 style="border-left-color: ${categoryColors[tool.category].color}">
          <div class="flex items-start justify-between">
            <div>
              <h3 class="tool-name">${tool.name}</h3>
              <p class="tool-desc">${tool.description}</p>
            </div>
            <span class="badge category-${tool.category}">${tool.category}</span>
          </div>
        </article>
      `).join('');
    }
    
    // Render initial grid
    renderTools(toolsData);
    
    // Filter chips event listeners
    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        // Update active state
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        
        const category = chip.dataset.category;
        const filteredTools = category === 'all' 
          ? toolsData 
          : toolsData.filter(t => t.category === category);
        
        renderTools(filteredTools);
      });
    });
    
    // Search functionality
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      
      if (!term) {
        renderTools(toolsData);
        return;
      }
      
      const filteredTools = toolsData.filter(tool => 
        tool.name.toLowerCase().includes(term) || 
        tool.description.toLowerCase().includes(term)
      );
      
      renderTools(filteredTools);
    });
    
    // Modal functionality
    function showToolDetails(tool) {
      modalContent.innerHTML = `
        <h2 class="modal-tool-name">${tool.name}</h2>
        <span class="modal-tool-category badge ${tool.category}">${capitalize(tool.category)}</span>
        <p class="modal-tool-desc">${tool.description}</p>
      `;
      
      modal.classList.remove('hidden');
      modal.style.display = 'flex';
    }
    
    function closeModal() {
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }
    
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
    
    // Language switch
    const ruBtn = document.querySelector('.ru-btn');
    const enBtn = document.querySelector('.en-btn');
    
    ruBtn.addEventListener('click', () => {
      ruBtn.classList.add('locale-switch-option-active');
      enBtn.classList.remove('locale-switch-option-active');
    });
    
    enBtn.addEventListener('click', () => {
      enBtn.classList.add('locale-switch-option-active');
      ruBtn.classList.remove('locale-switch-option-active');
    });
    
    // Modal close on overlay click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });
    
    // Handle resize
    window.addEventListener('resize', () => {
      // Could re-calculate grid here
    });
    
    // Reduced motion check
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      // No animations needed
    }
  </script>
</body>
</html>
