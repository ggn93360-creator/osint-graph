<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Graph — Fixed IP Engine</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.11.2/bundle/libphonenumber-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --panel: #151515; --border: #2a2a2a;
    --text: #fafafa; --muted: #8a8a8a; --accent: #00d4aa;
    --sidebar-width: 420px;
  }
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  
  .app-layout { display: flex; width: 100vw; height: 100vh; }

  .graph-container {
    flex: 1; position: relative;
    background-image: radial-gradient(#222 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #network { width: 100%; height: 100%; outline: none; }

  #toolbar {
    position: absolute; bottom: 20px; left: 20px;
    display: flex; gap: 10px; z-index: 10;
  }
  #toolbar button {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 10px 15px; border-radius: 8px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  #toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  #toolbar button.active { background: var(--accent); color: #000; border-color: var(--accent); }

  #inspector {
    width: var(--sidebar-width); background: var(--panel);
    border-left: 1px solid var(--border); padding: 25px;
    overflow-y: auto; flex-shrink: 0;
    transform: translateX(100%); transition: transform 0.3s ease;
    position: absolute; right: 0; top: 0; bottom: 0; z-index: 20;
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
  }
  #inspector.open { transform: translateX(0); }
  #inspector h2 { margin: 0 0 10px; font-size: 1.4rem; color: var(--accent); word-break: break-all; line-height: 1.3; }
  .type-badge { display: inline-block; font-size: 0.75rem; padding: 3px 8px; background: rgba(0,212,170,0.15); color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; margin-bottom: 20px; text-transform: uppercase; font-weight: bold; }
  
  .info-block { margin-bottom: 20px; border-bottom: 1px dashed var(--border); padding-bottom: 15px;}
  .info-block:last-child { border-bottom: none; }
  .info-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 700;}
  .info-value { font-size: 0.95rem; line-height: 1.6; word-break: break-all; white-space: pre-wrap; }
  .info-value img { max-width: 100px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); float: left; margin-right: 15px;}

  #map-container {
    width: 100%; height: 300px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border); background: #1a1a1a; margin-top: 10px;
    z-index: 5;
  }
  .leaflet-bar a { background-color: var(--panel) !important; color: var(--text) !important; border-bottom: 1px solid var(--border) !important; }
  .leaflet-bar a:hover { background-color: var(--border) !important; }
  .leaflet-popup-content-wrapper { background: var(--panel) !important; color: var(--text) !important; border: 1px solid var(--accent); }
  .leaflet-popup-tip { background: var(--panel) !important; }

  .search-result-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
  .search-result-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .sr-title { color: #64a0ff !important; text-decoration: none !important; font-size: 1rem !important; font-weight: 600 !important; display: block !important; margin-bottom: 5px !important; }
  .sr-title:hover { text-decoration: underline !important; }
  .sr-snippet { color: var(--text); font-size: 0.85rem; line-height: 1.4; margin-bottom: 5px; }
  .sr-url { color: var(--accent); font-size: 0.75rem; font-family: monospace; word-break: break-all; }

  .open-link-btn {
    display: block; width: 100%; text-align: center; background: transparent;
    color: var(--accent); font-weight: 700; padding: 12px; border-radius: 8px;
    text-decoration: none; font-size: 0.95rem; transition: all 0.2s; margin-top: 10px;
    border: 1px solid var(--accent);
  }
  .open-link-btn:hover { background: var(--accent); color: #000; }

  #close-inspector { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
  #close-inspector:hover { color: var(--text); }

  .hud {
    position: absolute; top: 20px; left: 20px;
    background: rgba(21, 21, 21, 0.85); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 8px; pointer-events: none; z-index: 10;
  }
  .hud h1 { margin: 0 0 5px; font-size: 1.1rem; color: var(--accent); }
  .hud p { margin: 0; font-size: 0.8rem; color: var(--muted); }

  #ctx-menu {
    position: absolute; display: none;
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    z-index: 1000; width: 300px; overflow: hidden;
  }
  #ctx-menu input {
    width: 100%; box-sizing: border-box; background: #000;
    border: none; border-bottom: 1px solid var(--border);
    color: var(--text); padding: 12px 15px; font-size: 0.9rem;
    font-family: ui-monospace, monospace; outline: none;
  }
  #ctx-menu input:focus { background: #0a0a0a; }
  #ctx-menu input:last-of-type { border-bottom: 1px solid var(--accent); }
  #ctx-menu button {
    width: 100%; background: transparent; border: none; color: var(--text);
    padding: 14px 15px; text-align: left; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  #ctx-menu button:hover { background: var(--accent); color: #000; }
</style>
</head>
<body>

<div class="app-layout">
  <div class="graph-container" id="graph-container">
    <div class="hud">
      <h1>OSINT Graph</h1>
      <p>ПКМ по полю → Добавить данные.<br>ЛКМ по узлу → Детальная инфа и Карта.</p>
    </div>
    <div id="network"></div>
    
    <div id="toolbar">
      <button id="btn-connect">🔗 Соединить</button>
      <button id="btn-delete">🗑️ Удалить</button>
      <button id="btn-physics" class="active">⚙️ Физика: ВКЛ</button>
    </div>

    <div id="ctx-menu">
      <input type="text" id="ctx-input" placeholder="ФИО, Email, IP, Ник..." autocomplete="off">
      <input type="text" id="ctx-dob" placeholder="Дата рождения (для ФИО)..." autocomplete="off">
      <button id="ctx-btn">🔍 Анализировать</button>
    </div>
  </div>

  <div id="inspector">
    <button id="close-inspector">✕</button>
    <div id="inspector-content">
      <p style="color:var(--muted); font-size:0.9rem;">Кликни на узел, чтобы прочитать данные.</p>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const container = document.getElementById('network');
  const nodes = new vis.DataSet([]);
  const edges = new vis.DataSet([]);
  let nodeIdCounter = 0;

  const data = { nodes, edges };
  
  const options = {
    nodes: {
      shape: 'box', borderRadius: 8, margin: 12,
      font: { color: '#fff', size: 13, face: 'monospace', multi: false, align: 'center' },
      borderWidth: 2, shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 10, x: 2, y: 2 },
      widthConstraint: { maximum: 220 }
    },
    edges: {
      color: { color: '#444', highlight: '#00d4aa' },
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      smooth: { type: 'cubicBezier', roundness: 0.5 }
    },
    physics: {
      enabled: true, solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.05, springLength: 160, springConstant: 0.08, damping: 0.4, avoidOverlap: 1 },
      stabilization: { iterations: 100 }
    },
    interaction: { hover: true, dragNodes: true, dragView: true, tooltipDelay: 999999 }
  };

  const network = new vis.Network(container, data, options);

  /* =====================================================
     ИНСТРУМЕНТЫ
     ===================================================== */
  const btnConnect = document.getElementById('btn-connect');
  const btnDelete = document.getElementById('btn-delete');
  const btnPhysics = document.getElementById('btn-physics');
  
  let isConnecting = false;
  let firstConnectNode = null;

  btnConnect.addEventListener('click', () => {
    isConnecting = !isConnecting;
    btnConnect.classList.toggle('active', isConnecting);
    firstConnectNode = null;
    if(isConnecting) alert('Режим соединения ВКЛЮЧЕН.\nКликни по первому узлу, затем по второму.');
  });

  network.on("click", function(params) {
    if (!isConnecting || params.nodes.length === 0) return;
    let clickedNode = params.nodes[0];
    if (!firstConnectNode) {
      firstConnectNode = clickedNode;
      network.selectNodes([clickedNode]);
    } else if (firstConnectNode !== clickedNode) {
      edges.add({ from: firstConnectNode, to: clickedNode, color: { color: '#00d4aa' } });
      firstConnectNode = null;
      isConnecting = false;
      btnConnect.classList.remove('active');
      network.unselectAll();
    }
  });

  btnDelete.addEventListener('click', () => {
    let selNodes = network.getSelectedNodes();
    let selEdges = network.getSelectedEdges();
    if (selNodes.length === 0 && selEdges.length === 0) {
      alert('Сначала выдели узлы или линии.');
      return;
    }
    nodes.remove(selNodes);
    edges.remove(selEdges);
    closeInspector();
  });

  btnPhysics.addEventListener('click', () => {
    let isEnabled = network.physics.physicsEnabled;
    network.setOptions({ physics: { enabled: !isEnabled } });
    btnPhysics.textContent = isEnabled ? '⚙️ Физика: ВЫКЛ' : '⚙️ Физика: ВКЛ';
    btnPhysics.classList.toggle('active', !isEnabled);
  });

  /* =====================================================
     ИНСПЕКТОР
     ===================================================== */
  const inspector = document.getElementById('inspector');
  const inspectorContent = document.getElementById('inspector-content');
  let mapInstance = null;
  
  document.getElementById('close-inspector').addEventListener('click', closeInspector);

  function closeInspector() {
    inspector.classList.remove('open');
    network.unselectAll();
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  }

  network.on("selectNode", function (params) {
    if (params.nodes.length > 0) {
      const nodeData = nodes.get(params.nodes[0]);
      if (nodeData && nodeData.meta) {
        renderInspector(nodeData);
        inspector.classList.add('open');
      }
    }
  });

  network.on("deselectNode", closeInspector);

  function renderInspector(node) {
    const m = node.meta;
    let html = '';
    
    if (m.avatar) html += `<img src="${m.avatar}" onerror="this.style.display='none'">`;
    html += `<h2>${esc(m.title || node.label)}</h2>`;
    html += `<span class="type-badge">${esc(m.type || 'unknown')}</span>`;

    if (m.description) {
      html += `<div class="info-block"><div class="info-label">Данные</div><div class="info-value">${esc(m.description)}</div></div>`;
    }
    
    html += `<div id="map-container" style="display:none;"></div>`;

    if (m.stats) {
      html += `<div class="info-block"><div class="info-label">Дополнительно</div><div class="info-value">${esc(m.stats)}</div></div>`;
    }
    
    if (m.searchResults && m.searchResults.length > 0) {
      html += `<div class="info-block"><div class="info-label">Результаты поиска</div><div class="info-value">`;
      m.searchResults.forEach(r => {
        html += `<div class="search-result-item">
            <a href="${esc(r.link)}" target="_blank" class="sr-title">${esc(r.title)}</a>
            <div class="sr-snippet">${esc(r.snippet)}</div>
            <div class="sr-url">${esc(r.link)}</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    if (m.link) {
      html += `<div class="info-block">
        <div class="info-label">Источник</div>
        <a href="${esc(m.link)}" target="_blank" class="open-link-btn">Перейти на сайт ↗</a>
      </div>`;
    }

    inspectorContent.innerHTML = html;

    if (m.lat && m.lon) {
      setTimeout(() => {
        let mapDiv = document.getElementById('map-container');
        if (!mapDiv) return;
        
        mapDiv.style.display = 'block';
        if (mapInstance) mapInstance.remove(); 
        
        mapInstance = L.map('map-container', { zoomControl: true }).setView([m.lat, m.lon], 15);
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri',
          maxZoom: 19
        }).addTo(mapInstance);
        
        L.marker([m.lat, m.lon]).addTo(mapInstance)
          .bindPopup(esc(m.title || "Location")).openPopup();
          
        setTimeout(() => mapInstance.invalidateSize(), 200);
      }, 50);
    }
  }

  /* =====================================================
     ДОБАВЛЕНИЕ УЗЛОВ
     ===================================================== */
  function addNode(title, group, metaData, parentId) {
    const id = 'node_' + (nodeIdCounter++);
    
    let bgColor = '#1a1a1a', borderColor = '#555', textColor = '#fff';
    
    if (group === 'input') { bgColor = '#ff9f43'; borderColor = '#ff9f43'; textColor = '#000'; }
    if (group === 'person') { bgColor = '#fdcb6e'; borderColor = '#fdcb6e'; textColor = '#000'; }
    if (group === 'found') { bgColor = '#1a1a1a'; borderColor = '#00d4aa'; textColor = '#fff'; }
    if (group === 'email') { bgColor = '#ee5a24'; borderColor = '#ee5a24'; textColor = '#fff'; }
    if (group === 'ip') { bgColor = '#4ecdc4'; borderColor = '#4ecdc4'; textColor = '#000'; }
    if (group === 'domain') { bgColor = '#00d4aa'; borderColor = '#00d4aa'; textColor = '#000'; }
    if (group === 'phone') { bgColor = '#fd79a8'; borderColor = '#fd79a8'; textColor = '#000'; }
    if (group === 'error') { bgColor = '#ff6b6b'; borderColor = '#ff6b6b'; textColor = '#fff'; }

    let labelStr = `${title}`;
    
    if (metaData.stats) {
        let s = metaData.stats.replace(/\n/g, ' | ');
        if (s.length > 35) s = s.substring(0, 32) + '...';
        labelStr += `\n📊 ${s}`;
    }
    
    if (metaData.description && metaData.description !== 'Нет описания' && metaData.description !== 'Загрузка результатов...' && metaData.description !== 'Начальный запрос') {
        let d = metaData.description.replace(/\n/g, ' ').trim();
        if (d.length > 35) d = d.substring(0, 32) + '...';
        labelStr += `\n📝 ${d}`;
    }

    nodes.add({
      id: id, label: labelStr, group: group, 
      color: { background: bgColor, border: borderColor }, font: { color: textColor },
      meta: Object.assign({ type: group, title: title }, metaData)
    });

    if (parentId) edges.add({ from: parentId, to: id });
    return id;
  }

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

  /* =====================================================
     МЕНЮ ПКМ
     ===================================================== */
  const ctxMenu = document.getElementById('ctx-menu');
  const ctxInput = document.getElementById('ctx-input');
  const ctxDob = document.getElementById('ctx-dob');
  const ctxBtn = document.getElementById('ctx-btn');
  const graphContainer = document.getElementById('graph-container');

  graphContainer.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    ctxMenu.style.display = 'block';
    ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 320) + 'px';
    ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 160) + 'px';
    ctxInput.value = ''; ctxDob.value = ''; ctxInput.focus();
  });

  document.addEventListener('click', function(e) {
    if (e.target !== ctxMenu && !ctxMenu.contains(e.target)) ctxMenu.style.display = 'none';
  });

  ctxInput.addEventListener('keydown', e => { if (e.key === 'Enter') ctxBtn.click(); });
  ctxDob.addEventListener('keydown', e => { if (e.key === 'Enter') ctxBtn.click(); });
  ctxBtn.addEventListener('click', () => {
    let val = ctxInput.value.trim(), dob = ctxDob.value.trim();
    if (val) createGraphNode(val, dob);
  });

  /* =====================================================
     ОПРЕДЕЛЕНИЕ ТИПА
     ===================================================== */
  function detectType(text, dob) {
    const val = text.trim();
    if (dob || /^[А-Яа-яЁёA-Za-z]+\s+[А-Яа-яЁёA-Za-z]+(\s+[А-Яа-яЁёA-Za-z]+)?$/.test(val)) return 'person';
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return 'email';
    if (/^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/.test(val)) return 'ip';
    if (/^\+?[1-9]\d{7,14}$/.test(val.replace(/[\s\-\(\)]/g, '')) && !val.includes('.')) return 'phone'; 
    if (/^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/.test(val)) return 'domain';
    return 'username';
  }

  function createGraphNode(val, dob) {
    ctxMenu.style.display = 'none';
    let type = detectType(val, dob);
    let title = type === 'person' ? `${val} (ДР: ${dob || '?'})` : val;
    
    let rootId = addNode(val, 'input', { type: type, title: title, description: dob ? `Дата рождения: ${dob}` : 'Начальный запрос' });
    
    let query = type === 'person' && dob ? `"${val}" ${dob}` : val;
    liveSearch(query, rootId);

    if (type === 'email') analyzeEmail(val, rootId);
    else if (type === 'ip') analyzeIP(val, rootId);
    else if (type === 'phone') analyzePhone(val, rootId);
    else if (type === 'domain') analyzeDomain(val, rootId);
    else if (type === 'username') analyzeUsername(val, rootId);
  }

  /* =====================================================
     ЗАПРОСЫ С ФОЛБЭКОМ
     ===================================================== */
  async function fetchWithFallback(targetUrl, type = 'json') {
    const encUrl = encodeURIComponent(targetUrl);
    const proxies = [
      (u) => u, 
      (u) => `https://api.allorigins.win/raw?url=${encUrl}`, 
      (u) => `https://corsproxy.io/?${encUrl}`
    ];
    
    for (let i = 0; i < proxies.length; i++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000); 
        const res = await fetch(proxies[i](targetUrl), { 
            signal: controller.signal, 
            headers: { 'Accept': type === 'json' ? 'application/json' : 'text/html' } 
        });
        clearTimeout(timeoutId);
        if (res.status === 404) throw new Error('404');
        if (!res.ok) continue;
        const text = await res.text();
        if (text.includes('Error:') && text.length < 200) continue;
        if (type === 'json') { 
            try { return JSON.parse(text); } catch (e) { continue; } 
        }
        return text;
      } catch (err) {
        if (err.message === '404') throw err; 
        continue; 
      }
    }
    throw new Error('All proxies failed');
  }

  function dohQuery(name, type){
    return fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`, { headers: { 'accept': 'application/dns-json' } })
      .then(r => r.json()).then(j => ({ type, answers: j.Answer || [] })).catch(() => ({ type, answers: [] }));
  }

  /* =====================================================
     АНАЛИЗ: FULL IP (ЧЕРЕЗ IPWHO.IS)
     ===================================================== */
  async function analyzeIP(ip, rootId) {
    try {
      // ipwho.is отдает CORS без всяких прокси и работает по HTTPS
      let res = await fetch(`https://ipwho.is/${encodeURIComponent(ip)}`);
      let data = await res.json();
      
      if (data.success) {
        let lat = data.latitude;
        let lon = data.longitude;
        
        // Инфа о соединении
        let conn = data.connection || {};
        let isp = conn.isp || 'Неизвестно';
        let org = conn.org || 'Неизвестно';
        let asn = conn.asn || 'Неизвестно';
        let type = conn.type || 'Неизвестно';

        let desc = `Провайдер: ${isp}\nОрганизация: ${org}\nТип сети: ${type}\nASN: ${asn}`;
        let stats = `Координаты: ${lat}, ${lon}`;

        addNode(`${data.city || '?'}, ${data.country || '?'}`, 'ip', {
          type: 'ip', 
          title: `IP: ${data.ip}`, 
          description: desc,
          stats: stats,
          lat: lat, 
          lon: lon
        }, rootId);
      } else {
        addNode(`${ip}`, 'ip', {
          type: 'ip', title: `IP: ${ip}`, description: `Данные не получены (Неверный IP или блокировка)`
        }, rootId);
      }
    } catch(e) {
        addNode(`Ошибка IP`, 'error', { type: 'error', title: 'Ошибка', description: e.message }, rootId);
    }
  }

  /* =====================================================
     АНАЛИЗ: USERNAME
     ===================================================== */
  async function analyzeUsername(username, rootId) {
    const enc = encodeURIComponent(username);
    try {
      let d = await fetchWithFallback(`https://api.github.com/users/${enc}`, 'json');
      if (d && d.id) {
        addNode(`GitHub: ${d.name || d.login}`, 'found', {
          type: 'github', title: `GitHub: ${d.name || d.login}`, avatar: d.avatar_url,
          description: d.bio || 'Нет описания', stats: `Repos: ${d.public_repos} | Followers: ${d.followers}`, link: d.html_url
        }, rootId);
      }
    } catch(e) {}
  }

  /* =====================================================
     АНАЛИЗ: EMAIL
     ===================================================== */
  function analyzeEmail(email, rootId) {
    const dom = email.split('@')[1];
    const emailHash = md5(email.trim().toLowerCase());

    fetch(`https://gravatar.com/${emailHash}.json`)
      .then(res => { if(res.status===404) throw new Error(); return res.json(); })
      .then(data => {
        let profile = data.entry && data.entry[0];
        if (profile) {
          addNode(`Gravatar: ${profile.displayName || 'Найден'}`, 'found', {
            type: 'gravatar', title: `Gravatar: ${profile.displayName || 'Найден'}`, avatar: `https://secure.gravatar.com/avatar/${emailHash}?s=150&d=404`,
            description: profile.aboutMe || 'Нет описания', stats: `Location: ${profile.currentLocation || '?'}`, link: `https://gravatar.com/${emailHash}`
          }, rootId);
        }
      }).catch(() => {});
  }

  /* =====================================================
     АНАЛИЗ: PHONE, DOMAIN, LIVE SEARCH
     ===================================================== */
  async function analyzePhone(phone, rootId) {
    let clean = phone.replace(/[\s\-\(\)]/g, '');
    let display = clean.charAt(0)==='+' ? clean : '+' + clean;
    try {
      let phoneNumber = libphonenumber.parsePhoneNumberFromString(display);
      if (phoneNumber && phoneNumber.isValid()) {
        addNode(`Номер: ${phoneNumber.formatInternational()}`, 'phone', {
          type: 'phone', title: `Номер`, description: `Страна: ${phoneNumber.country}\nТип: ${phoneNumber.getType()}`
        }, rootId);
      }
    } catch(e) {}
  }

  function analyzeDomain(domain, rootId) {
    dohQuery(domain, 'A').then(r => {
      r.answers.forEach(a => {
        analyzeIP(a.data, rootId);
      });
    });
  }

  async function liveSearch(query, parentId) {
    let id = addNode(`Live Search: ${query.substring(0,15)}...`, 'found', {
      type: 'search', title: `Поиск: ${query}`, description: 'Загрузка результатов...', stats: '⏳ Сканирую...'
    }, parentId);

    try {
      let url = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
      let html = await fetchWithFallback(url, 'html');
      
      let parser = new DOMParser();
      let doc = parser.parseFromString(html, 'text/html');
      let results = [];
      
      let resultNodes = doc.querySelectorAll('.result__body');
      
      resultNodes.forEach((node, index) => {
        if(index >= 5) return; 
        let titleEl = node.querySelector('.result__a');
        let snippetEl = node.querySelector('.result__snippet');
        
        if(titleEl) {
          let title = titleEl.textContent.trim();
          let link = titleEl.getAttribute('href');
          
          if(link && link.includes('uddg=')) {
            link = decodeURIComponent(link.split('uddg=')[1].split('&')[0]);
          }
          
          let snippet = snippetEl ? snippetEl.textContent.trim() : 'Нет описания';
          results.push({ title, link, snippet });
        }
      });

      let nodeData = nodes.get(id);
      if (results.length > 0) {
        nodeData.meta.stats = `✅ Найдено: ${results.length}`;
        nodeData.meta.searchResults = results;
        nodeData.meta.link = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
        nodeData.label = `Live Search\n✅ Найдено: ${results.length}\n${query.substring(0, 15)}...`;
      } else {
        nodeData.meta.stats = `⚠️ Результатов нет`;
        nodeData.meta.link = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        nodeData.label = `Live Search\n⚠️ Результатов нет`;
      }
      nodes.update(nodeData);

      if (network.getSelectedNodes().includes(id)) renderInspector(nodeData);

    } catch(e) {
      let nodeData = nodes.get(id);
      nodeData.meta.stats = `❌ Ошибка CORS`;
      nodeData.meta.link = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      nodeData.label = `Live Search\n❌ Ошибка CORS`;
      nodes.update(nodeData);
      if (network.getSelectedNodes().includes(id)) renderInspector(nodeData);
    }
  }

})();
</script>
